project:
  type: book
  output-dir: _site
  resources:
    - widgets/**

book:
  title: "Expectation Arbitrage"
  subtitle: "期待値曲線を踏まえたタスクポートフォリオ最適化"
  author: "tak-tak-toe"
  description: "レビュー時評価、フィードバックによる品質改善、複数タスクの時間配分を数理モデルと決定論的最適化で考えるノート"
  site-url: "https://tak-tak-toe.github.io/expectation-arbitrage/"
  repo-url: "https://github.com/tak-tak-toe/expectation-arbitrage"
  repo-branch: main
  repo-actions: [source, issue]
  page-navigation: true
  reader-mode: true
  search: true
  chapters:
    - index.qmd
    - chapters/01-review-score.qmd
    - chapters/02-review-quality.qmd
    - chapters/03-overall-evaluation.qmd
    - chapters/04-multiple-tasks.qmd
    - chapters/05-constrained-optimization.qmd

bibliography: references.bib
link-citations: true

crossref:
  chapters: true

format:
  html:
    theme:
      light:
        - cosmo
        - styles/textbook.scss
      dark:
        - darkly
        - styles/textbook.scss
    html-math-method: mathjax
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 230px
      gutter-width: 1.5rem
